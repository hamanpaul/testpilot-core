version: 1
project: testpilot
policy_profile: flat
policy_version: "1.0.15"
preflight:
  steps:
    # 註：openspec gate 暫不宣告——本 repo 現有 4 個 spec（audit-mode、
    # plugin-entry-points-discovery、plugin-runner-reporter-separation、
    # wifi-llapi-alignment-guardrails）缺 `#### Scenario:` 區塊而驗證失敗，
    # 早於本次升級存在（未修改的 main 上結果相同：17 passed / 4 failed）。
    # 補齊後再把此步驟加回。
    - name: tests
      kind: tests
      argv: [".venv/bin/python", "-m", "pytest", "-q", "tests"]
      timeout_seconds: 1800
secret_scan:
  # R-21（v1.0.13 起依 visibility+tier 判定；本 repo 為 public）：歷史紀錄型文件
  # 保留當時的決策脈絡，改寫等同竄改紀錄，故以 allow-list 標示為合法引用。
  # live code、現行 docs 與 agent convention 檔皆已完成減敏，不在此清單內。
  allow:
    - "docs/superpowers/**"
    - "openspec/changes/archive/**"
    - "CHANGELOG.md"
tier: work
policy:
  config_name: .project-policy.yml
  release_version_source: VERSION
  required_checks:
    - release-version
    - cli-help-sync
    - policy-config
    - agent-instructions-sync
cli:
  - command: "bash scripts/policy_cli_help.sh"
    help_args: ["--help"]
    reflected_in: "README.md"
    marker: "testpilot-help"
  - command: "bash scripts/policy_cli_help.sh"
    help_args: ["--update", "--help"]
    reflected_in: "README.md"
    marker: "testpilot-update-help"
policy_check:
  repository: hamanpaul/paulsha-conventions
  config: .project-policy.yml
  pin_required: true
  workflow_ref: hamanpaul/paulsha-conventions/.github/workflows/reusable-policy-check.yml@a764806046c410eb4f254ac0b6a8aec8b7559dab
